<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Samuel - Šifrovací pomůcky pro terénní šifrovačky" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Samuel</title>
    <style>
      :root {
        --color-bg-canvas: #000000;
        --color-surface-1: #121214;
        --color-surface-2: #1c1c22;
        --color-surface-active: #323240;
        --color-border-subtle: #2a2a34;
        --color-border-medium: #3a3a48;
        --color-text-primary: #ffffff;
        --color-text-secondary: #9da0af;
        --color-text-muted: #626474;
        --color-accent-primary: #00d2ff;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-full: 9999px;
        --tap-min-size: 48px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background-color: var(--color-bg-canvas);
        color: var(--color-text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      #app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      #bootstrap-shell {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: var(--color-bg-canvas);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .shell-card {
        width: 100%;
        max-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .shell-header {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .shell-logo {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 3px;
        color: var(--color-text-primary);
        text-transform: uppercase;
      }

      .shell-sub {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        color: var(--color-accent-primary);
        text-transform: uppercase;
      }

      .shell-checking {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px 0;
      }

      .shell-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid var(--color-border-subtle);
        border-top-color: var(--color-accent-primary);
        border-radius: 50%;
        animation: shell-spin 0.7s linear infinite;
      }

      @keyframes shell-spin {
        to { transform: rotate(360deg); }
      }

      .shell-checking-text {
        font-size: 13px;
        color: var(--color-text-muted);
      }

      .shell-first-run {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .shell-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--color-text-primary);
        text-align: center;
      }

      .shell-desc {
        font-size: 13px;
        line-height: 1.45;
        color: var(--color-text-secondary);
        text-align: center;
      }

      .shell-packages {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background-color: var(--color-surface-1);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-sm);
        padding: 4px;
      }

      .shell-pkg-item {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: var(--tap-min-size);
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background-color: var(--color-surface-2);
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .shell-pkg-item:active {
        background-color: var(--color-surface-active);
      }

      .shell-pkg-item input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 22px;
        height: 22px;
        border-radius: 4px;
        border: 2px solid var(--color-border-medium);
        background-color: var(--color-bg-canvas);
        cursor: pointer;
        display: grid;
        place-content: center;
        flex-shrink: 0;
        transition: border-color 0.15s, background-color 0.15s;
      }

      .shell-pkg-item input[type="checkbox"]:checked {
        border-color: var(--color-accent-primary);
        background-color: var(--color-accent-primary);
      }

      .shell-pkg-item input[type="checkbox"]:checked::before {
        content: "";
        width: 10px;
        height: 6px;
        border-left: 2px solid #000000;
        border-bottom: 2px solid #000000;
        transform: rotate(-45deg) translate(1px, -1px);
      }

      .shell-pkg-item input[type="checkbox"]:disabled {
        opacity: 0.8;
        cursor: default;
      }

      .shell-pkg-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }

      .shell-pkg-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--color-text-primary);
      }

      .shell-pkg-size {
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .shell-progress-box {
        width: 100%;
        height: 52px;
        min-height: 52px;
        position: relative;
        background-color: var(--color-surface-2);
        border: 1px solid var(--color-border-medium);
        border-radius: var(--radius-sm);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }

      .shell-progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 0%;
        background-color: var(--color-accent-primary);
        opacity: 0.28;
        border-right: 2px solid var(--color-accent-primary);
        transition: width 0.15s ease;
      }

      .shell-progress-text {
        position: relative;
        z-index: 1;
        font-size: 14px;
        font-weight: 600;
        color: var(--color-text-primary);
        text-align: center;
        padding: 0 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .shell-btn {
        width: 100%;
        min-height: 52px;
        background-color: var(--color-accent-primary);
        color: #000000;
        font-size: 15px;
        font-weight: 700;
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.05s ease, opacity 0.15s ease;
      }

      .shell-btn:active:not(:disabled) {
        transform: scale(0.98);
        opacity: 0.9;
      }

      .shell-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="bootstrap-shell">
      <div class="shell-card">
        <div class="shell-header">
          <div class="shell-logo">SAMUEL</div>
          <div class="shell-sub">Šifrovací pomůcky</div>
        </div>

        <div id="shell-checking" class="shell-checking">
          <div class="shell-spinner"></div>
          <div class="shell-checking-text">Kontrola offline mezipaměti…</div>
        </div>

        <div id="shell-first-run" class="shell-first-run" style="display: none;">
          <h1 class="shell-title">První spuštění</h1>
          <p class="shell-desc">
            Aplikace funguje 100% offline v terénu bez signálu. Zvolte balíčky k uložení do paměti telefonu:
          </p>

          <div class="shell-packages">
            <label class="shell-pkg-item">
              <input type="checkbox" id="pkg-app" checked disabled />
              <div class="shell-pkg-info">
                <span class="shell-pkg-name">Aplikace a šifrovací nástroje</span>
                <span class="shell-pkg-size">~1,5 MB • Vyžadováno</span>
              </div>
            </label>

            <label class="shell-pkg-item" for="pkg-db">
              <input type="checkbox" id="pkg-db" />
              <div class="shell-pkg-info">
                <span class="shell-pkg-name">Slovníková databáze</span>
                <span class="shell-pkg-size">~102 MB • Volitelné</span>
              </div>
            </label>
          </div>

          <button id="shell-download-btn" class="shell-btn" type="button">
            Stáhnout vybrané a spustit
          </button>

          <div id="shell-progress-box" class="shell-progress-box" style="display: none;">
            <div id="shell-progress-fill" class="shell-progress-fill"></div>
            <div id="shell-progress-text" class="shell-progress-text">Připravuji stahování…</div>
          </div>
        </div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
