<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Samuel - Šifrovací pomůcky pro terénní šifrovačky" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Samuel</title>
    <style>
      :root {
        --color-bg-canvas: #000000;
        --color-surface-sunken: #0a0a0a;
        --color-surface-1: #121212;
        --color-surface-2: #1c1c1c;
        --color-surface-3: #262626;
        --color-surface-active: #333333;
        --color-border-sunken: #222222;
        --color-border-subtle: #2e2e2e;
        --color-border-medium: #424242;
        --color-border-system: #363636;
        --color-text-primary: #ffffff;
        --color-text-secondary: #b3b3b3;
        --color-text-muted: #828282;
        --color-accent-primary: #00d2ff;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-full: 9999px;
        --tap-min-size: 48px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background-color: var(--color-bg-canvas);
        color: var(--color-text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      #app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      #bootstrap-shell {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: var(--color-bg-canvas);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .shell-card {
        width: 100%;
        max-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .shell-header {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .shell-logo {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 3px;
        color: var(--color-text-primary);
        text-transform: uppercase;
      }

      .shell-sub {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        color: var(--color-accent-primary);
        text-transform: uppercase;
      }

      .shell-checking {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px 0;
      }

      .shell-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid var(--color-border-subtle);
        border-top-color: var(--color-accent-primary);
        border-radius: 50%;
        animation: shell-spin 0.7s linear infinite;
      }

      @keyframes shell-spin {
        to { transform: rotate(360deg); }
      }

      .shell-checking-text {
        font-size: 13px;
        color: var(--color-text-muted);
      }

      .shell-first-run {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .shell-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--color-text-primary);
        text-align: center;
      }

      .shell-desc {
        font-size: 13px;
        line-height: 1.45;
        color: var(--color-text-secondary);
        text-align: center;
      }

      .shell-packages {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background-color: var(--color-surface-1);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-sm);
        padding: 4px;
      }

      .shell-pkg-item {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: var(--tap-min-size);
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background-color: var(--color-surface-2);
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .shell-pkg-item:active {
        background-color: var(--color-surface-active);
      }

      .shell-pkg-item input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 22px;
        height: 22px;
        border-radius: 4px;
        border: 2px solid var(--color-border-medium);
        background-color: var(--color-bg-canvas);
        cursor: pointer;
        display: grid;
        place-content: center;
        flex-shrink: 0;
        transition: border-color 0.15s, background-color 0.15s;
      }

      .shell-pkg-item input[type="checkbox"]:checked {
        border-color: var(--color-accent-primary);
        background-color: var(--color-accent-primary);
      }

      .shell-pkg-item input[type="checkbox"]:checked::before {
        content: "";
        width: 10px;
        height: 6px;
        border-left: 2px solid #000000;
        border-bottom: 2px solid #000000;
        transform: rotate(-45deg) translate(1px, -1px);
      }

      .shell-pkg-item input[type="checkbox"]:disabled {
        opacity: 0.8;
        cursor: default;
      }

      .shell-pkg-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }

      .shell-pkg-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--color-text-primary);
      }

      .shell-pkg-size {
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .shell-progress-box {
        width: 100%;
        height: 52px;
        min-height: 52px;
        position: relative;
        background-color: var(--color-surface-2);
        border: 1px solid var(--color-border-medium);
        border-radius: var(--radius-sm);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }

      .shell-progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 0%;
        background-color: var(--color-accent-primary);
        opacity: 0.28;
        border-right: 2px solid var(--color-accent-primary);
        transition: width 0.15s ease;
      }

      .shell-progress-text {
        position: relative;
        z-index: 1;
        font-size: 14px;
        font-weight: 600;
        color: var(--color-text-primary);
        text-align: center;
        padding: 0 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .shell-btn {
        width: 100%;
        min-height: 52px;
        background-color: var(--color-accent-primary);
        color: #000000;
        font-size: 15px;
        font-weight: 700;
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.05s ease, opacity 0.15s ease;
      }

      .shell-btn:active:not(:disabled) {
        transform: scale(0.98);
        opacity: 0.9;
      }

      .shell-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="bootstrap-shell">
      <div class="shell-card">
        <div class="shell-header">
          <div class="shell-logo">SAMUEL</div>
          <div class="shell-sub">Šifrovací pomůcky</div>
        </div>

        <div id="shell-checking" class="shell-checking">
          <div class="shell-spinner"></div>
          <div class="shell-checking-text">Kontrola offline mezipaměti…</div>
        </div>

        <div id="shell-first-run" class="shell-first-run" style="display: none;">
          <h1 class="shell-title">První spuštění</h1>
          <p class="shell-desc">
            Aplikace funguje 100% offline v terénu bez signálu. Zvolte balíčky k uložení do paměti telefonu:
          </p>

          <div class="shell-packages">
            <label class="shell-pkg-item">
              <input type="checkbox" id="pkg-app" checked disabled />
              <div class="shell-pkg-info">
                <span class="shell-pkg-name">Aplikace a šifrovací nástroje</span>
                <span class="shell-pkg-size">~1,5 MB • Vyžadováno</span>
              </div>
            </label>

            <label class="shell-pkg-item" for="pkg-db">
              <input type="checkbox" id="pkg-db" />
              <div class="shell-pkg-info">
                <span class="shell-pkg-name">Slovníková databáze</span>
                <span class="shell-pkg-size">~102 MB • Volitelné</span>
              </div>
            </label>
          </div>

          <button id="shell-download-btn" class="shell-btn" type="button">
            Stáhnout vybrané a spustit
          </button>

          <div id="shell-progress-box" class="shell-progress-box" style="display: none;">
            <div id="shell-progress-fill" class="shell-progress-fill"></div>
            <div id="shell-progress-text" class="shell-progress-text">Připravuji stahování…</div>
          </div>
        </div>
      </div>
    </div>

    <div id="app"></div>
    <script>
      // Recovery safety net: if the app never signals a successful boot (or the
      // bootstrap module script itself fails to load - e.g. a 504 from the
      // cache-only Service Worker for a chunk an interrupted update never
      // downloaded) within a generous timeout, offer an in-app recovery action
      // instead of leaving a permanent white screen. Disarmed by bootstrap.ts
      // as soon as it legitimately shows the first-run download screen (which
      // owns its own error handling from that point on) or signals success.
      (function () {
        var RECOVERY_TIMEOUT_MS = 15000;
        var armed = true;
        var timeoutId = null;

        function disarm() {
          armed = false;
          if (timeoutId) {
            clearTimeout(timeoutId);
            timeoutId = null;
          }
        }

        // bootstrap.ts calls these to communicate with this safety net.
        window.__samuelBootSuccess = disarm;
        window.__samuelBootFirstRun = disarm;
        window.__samuelShowRecovery = function (reason) {
          showRecovery(reason);
        };

        function showRecovery(reason) {
          if (document.getElementById('recovery-overlay')) return;
          disarm();
          console.warn('Samuel recovery overlay shown:', reason);

          var overlay = document.createElement('div');
          overlay.id = 'recovery-overlay';
          overlay.style.cssText =
            'position:fixed;inset:0;z-index:999999;background:#000000;color:#ffffff;' +
            'display:flex;flex-direction:column;align-items:center;justify-content:center;' +
            'gap:16px;padding:24px;text-align:center;box-sizing:border-box;' +
            'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;';
          overlay.innerHTML =
            '<div style="font-size:16px;font-weight:700;">Aplikaci se nepodařilo spustit</div>' +
            '<div style="font-size:13px;line-height:1.5;color:#b3b3b3;max-width:320px;">' +
            'Offline mezipaměť je pravděpodobně neúplná po přerušené aktualizaci. ' +
            'Obnova ji smaže a stáhne aplikaci znovu &ndash; je nutné aktivní připojení k internetu.' +
            '</div>' +
            '<button id="recovery-btn" type="button" style="min-height:52px;padding:0 24px;' +
            'background-color:#00d2ff;color:#000000;font-size:15px;font-weight:700;border:none;' +
            'border-radius:6px;cursor:pointer;">Obnovit aplikaci</button>';
          document.body.appendChild(overlay);

          document.getElementById('recovery-btn').addEventListener('click', function () {
            var btn = document.getElementById('recovery-btn');
            if (btn) {
              btn.disabled = true;
              btn.textContent = 'Obnovuji…';
              btn.style.opacity = '0.6';
            }
            recoverAndReload();
          });
        }

        function recoverAndReload() {
          var done = function () {
            window.location.href = '/?sw-strategy=network';
          };

          var deleteAppCaches = function () {
            if (!('caches' in window)) return Promise.resolve();
            return caches
              .keys()
              .then(function (names) {
                // Only wipe app-related caches + the pointer; leave the
                // (potentially 100MB+) dictionary DB cache untouched so the
                // user doesn't need to re-download it after an app hiccup.
                var toDelete = names.filter(function (name) {
                  return name === 'samuel-app' || name === 'samuel-meta' || name.indexOf('samuel-app-') === 0;
                });
                // allSettled (not all): one stubborn cache failing to delete
                // must never block the others or the eventual reload.
                return Promise.allSettled(
                  toDelete.map(function (name) {
                    return caches.delete(name).then(function (ok) {
                      if (!ok) console.warn('Recovery: cache.delete() reported false for', name);
                    });
                  })
                );
              })
              .catch(function (e) {
                console.warn('Recovery: cache deletion failed', e);
              });
          };

          var unregisterServiceWorker = function () {
            // Deleting the caches alone is not enough: this page is still
            // CONTROLLED by the existing Service Worker, which serves
            // everything (except the exact bypassed URL below) strictly
            // cache-only. Without unregistering it, the fresh index.html we
            // navigate to would load fine (bypassed), but its own entry
            // script request would NOT carry the bypass and would 504
            // against the now-empty cache, breaking the very screen this
            // recovery is supposed to restore. Unregistering makes the next
            // navigation fully uncontrolled, like a brand new visitor.
            if (!('serviceWorker' in navigator)) return Promise.resolve();
            return navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                return Promise.allSettled(regs.map(function (reg) { return reg.unregister(); }));
              })
              .catch(function (e) {
                console.warn('Recovery: service worker unregister failed', e);
              });
          };

          try {
            Promise.allSettled([deleteAppCaches(), unregisterServiceWorker()]).then(done).catch(done);
          } catch (e) {
            done();
          }
        }

        // Catch the bootstrap module script (or any script) failing to load -
        // this fires even if bootstrap.ts itself never got to execute a single
        // line. Resource load errors don't bubble, so this must be capturing.
        window.addEventListener(
          'error',
          function (event) {
            var target = event && event.target;
            if (target && target.tagName === 'SCRIPT') {
              showRecovery('script-load-error');
            }
          },
          true
        );

        // Backstop: only fires if nothing has disarmed us by then (normal boot,
        // even on a slow low-end phone, or the legitimate first-run screen).
        timeoutId = setTimeout(function () {
          if (armed) showRecovery('timeout');
        }, RECOVERY_TIMEOUT_MS);
      })();
    </script>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
