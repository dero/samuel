<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      // Global zoom from Settings. It narrows the layout viewport (width = screen / zoom)
      // and lets the browser scale it back to the full screen, so CSS px, pointer
      // coordinates and getBoundingClientRect stay consistent for all code. Runs before
      // first paint; the app changes it via window.__samuelApplyZoom (settings state).
      // Desktop browsers ignore the meta viewport and use their own zoom instead.
      (function () {
        var TAIL = 'user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content';
        var current = 1;

        function screenWidth() {
          var a = screen.width;
          var b = screen.height;
          var landscape = window.matchMedia && window.matchMedia('(orientation: landscape)').matches;
          return landscape ? Math.max(a, b) : Math.min(a, b);
        }

        function apply(zoom) {
          current = typeof zoom === 'number' && zoom >= 0.5 && zoom <= 2 ? zoom : 1;
          var meta = document.querySelector('meta[name="viewport"]');
          if (!meta) return;
          var head =
            current === 1
              ? 'width=device-width, initial-scale=1.0, maximum-scale=1.0, '
              : 'width=' + Math.round(screenWidth() / current) +
                ', initial-scale=' + current +
                ', minimum-scale=' + current +
                ', maximum-scale=' + current + ', ';
          meta.setAttribute('content', head + TAIL);
        }

        var stored = 1;
        try {
          var root = JSON.parse(localStorage.getItem('samuel_settings') || '{}');
          stored = root && root.app ? root.app.zoom : 1;
        } catch (e) {}
        apply(stored);

        // The width is explicit, so a rotated screen needs a fresh one.
        function onRotate() {
          if (current !== 1) setTimeout(function () { apply(current); }, 150);
        }
        if (screen.orientation && screen.orientation.addEventListener) {
          screen.orientation.addEventListener('change', onRotate);
        } else {
          window.addEventListener('orientationchange', onRotate);
        }

        window.__samuelApplyZoom = apply;
      })();
    </script>
    <meta name="theme-color" content="#000000" />

    <title>Samuel – šifrovací pomůcky</title>
    <style>
      :root {
        --color-bg-canvas: #000000;
        --color-surface-sunken: #0a0a0a;
        --color-surface-1: #121212;
        --color-surface-2: #1c1c1c;
        --color-surface-3: #262626;
        --color-surface-active: #333333;
        --color-border-sunken: #222222;
        --color-border-subtle: #2e2e2e;
        --color-border-medium: #424242;
        --color-border-system: #363636;
        --color-text-primary: #ffffff;
        --color-text-secondary: #b3b3b3;
        --color-text-muted: #828282;
        --color-accent-primary: #00d2ff;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-full: 9999px;
        --tap-min-size: 48px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background-color: var(--color-bg-canvas);
        color: var(--color-text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      #app {
        position: fixed;
        inset: 0;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
        display: flex;
        flex-direction: column;
      }

      #bootstrap-shell {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: var(--color-bg-canvas);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
      }

      .shell-card {
        width: 100%;
        max-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .shell-header {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .shell-logo {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 3px;
        color: var(--color-text-primary);
        text-transform: uppercase;
      }

      .shell-sub {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        color: var(--color-accent-primary);
        text-transform: uppercase;
      }

      .shell-checking {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px 0;
      }

      .shell-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid var(--color-border-subtle);
        border-top-color: var(--color-accent-primary);
        border-radius: 50%;
        animation: shell-spin 0.7s linear infinite;
      }

      @keyframes shell-spin {
        to { transform: rotate(360deg); }
      }

      .shell-checking-text {
        font-size: 13px;
        color: var(--color-text-muted);
      }

      .shell-first-run {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .shell-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--color-text-primary);
        text-align: center;
      }

      .shell-desc {
        font-size: 13px;
        line-height: 1.45;
        color: var(--color-text-secondary);
        text-align: center;
      }

      .shell-packages {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background-color: var(--color-surface-1);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-sm);
        padding: 4px;
      }

      .shell-pkg-item {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: var(--tap-min-size);
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background-color: var(--color-surface-2);
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .shell-pkg-item:active {
        background-color: var(--color-surface-active);
      }

      .shell-pkg-item input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 22px;
        height: 22px;
        border-radius: 4px;
        border: 2px solid var(--color-border-medium);
        background-color: var(--color-bg-canvas);
        cursor: pointer;
        display: grid;
        place-content: center;
        flex-shrink: 0;
        transition: border-color 0.15s, background-color 0.15s;
      }

      .shell-pkg-item input[type="checkbox"]:checked {
        border-color: var(--color-accent-primary);
        background-color: var(--color-accent-primary);
      }

      .shell-pkg-item input[type="checkbox"]:checked::before {
        content: "";
        width: 10px;
        height: 6px;
        border-left: 2px solid #000000;
        border-bottom: 2px solid #000000;
        transform: rotate(-45deg) translate(1px, -1px);
      }

      .shell-pkg-item input[type="checkbox"]:disabled {
        opacity: 0.8;
        cursor: default;
      }

      .shell-pkg-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }

      .shell-pkg-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--color-text-primary);
      }

      .shell-pkg-size {
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .shell-progress-box {
        width: 100%;
        height: 52px;
        min-height: 52px;
        position: relative;
        background-color: var(--color-surface-2);
        border: 1px solid var(--color-border-medium);
        border-radius: var(--radius-sm);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }

      .shell-progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 0%;
        background-color: var(--color-accent-primary);
        opacity: 0.28;
        border-right: 2px solid var(--color-accent-primary);
        transition: width 0.15s ease;
      }

      .shell-progress-text {
        position: relative;
        z-index: 1;
        font-size: 14px;
        font-weight: 600;
        color: var(--color-text-primary);
        text-align: center;
        padding: 0 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .shell-btn {
        width: 100%;
        min-height: 52px;
        background-color: var(--color-accent-primary);
        color: #000000;
        font-size: 15px;
        font-weight: 700;
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.05s ease, opacity 0.15s ease;
      }

      .shell-btn:active:not(:disabled) {
        transform: scale(0.98);
        opacity: 0.9;
      }

      .shell-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="bootstrap-shell">
      <div class="shell-card">
        <div class="shell-header">
          <div class="shell-logo">SAMUEL</div>
          <div class="shell-sub">Šifrovací pomůcky</div>
        </div>

        <div id="shell-checking" class="shell-checking">
          <div class="shell-spinner"></div>
          <div class="shell-checking-text">Kontroluji offline data…</div>
        </div>

        <div id="shell-first-run" class="shell-first-run" style="display: none;">
          <h1 class="shell-title">První spuštění</h1>
          <p class="shell-desc">
            Vše funguje offline. Co stáhnout do telefonu?
          </p>

          <div class="shell-packages">
            <label class="shell-pkg-item">
              <input type="checkbox" id="pkg-app" checked disabled />
              <div class="shell-pkg-info">
                <span class="shell-pkg-name">Aplikace</span>
                <span class="shell-pkg-size">1,5 MB • povinné</span>
              </div>
            </label>

            <label class="shell-pkg-item" for="pkg-db">
              <input type="checkbox" id="pkg-db" />
              <div class="shell-pkg-info">
                <span class="shell-pkg-name">Slovník</span>
                <span class="shell-pkg-size" id="shell-pkg-db-size">97 MB • volitelné</span>
              </div>
            </label>
          </div>

          <button id="shell-download-btn" class="shell-btn" type="button">
            Stáhnout a spustit
          </button>

          <div id="shell-progress-box" class="shell-progress-box" style="display: none;">
            <div id="shell-progress-fill" class="shell-progress-fill"></div>
            <div id="shell-progress-text" class="shell-progress-text">Připravuji…</div>
          </div>
        </div>
      </div>
    </div>

    <div id="app"></div>
    <script>
      // Recovery safety net: if the app never signals a successful boot (or the
      // bootstrap module script itself fails to load - e.g. a 504 from the
      // cache-only Service Worker for a chunk an interrupted update never
      // downloaded) within a generous timeout, offer an in-app recovery action
      // instead of leaving a permanent white screen. Disarmed by bootstrap.ts
      // as soon as it legitimately shows the first-run download screen (which
      // owns its own error handling from that point on) or signals success.
      (function () {
        var RECOVERY_TIMEOUT_MS = 15000;
        var armed = true;
        var timeoutId = null;

        function disarm() {
          armed = false;
          if (timeoutId) {
            clearTimeout(timeoutId);
            timeoutId = null;
          }
        }

        // bootstrap.ts calls these to communicate with this safety net.
        window.__samuelBootSuccess = disarm;
        window.__samuelBootFirstRun = disarm;
        window.__samuelShowRecovery = function (reason) {
          showRecovery(reason);
        };

        function showRecovery(reason) {
          if (document.getElementById('recovery-overlay')) return;
          disarm();
          console.warn('Samuel recovery overlay shown:', reason);

          var overlay = document.createElement('div');
          overlay.id = 'recovery-overlay';
          overlay.style.cssText =
            'position:fixed;inset:0;z-index:999999;background:#000000;color:#ffffff;' +
            'display:flex;flex-direction:column;align-items:center;justify-content:center;' +
            'gap:16px;padding:24px;text-align:center;box-sizing:border-box;' +
            'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;';
          overlay.innerHTML =
            '<div style="font-size:16px;font-weight:700;">Aplikaci se nepodařilo spustit</div>' +
            '<div style="font-size:13px;line-height:1.5;color:#b3b3b3;max-width:320px;">' +
            'Offline data jsou nejspíš poškozená. Smažte je včetně slovníku ' +
            'a stáhněte aplikaci znovu &ndash; vyžaduje připojení.' +
            '</div>' +
            (navigator.onLine
              ? ''
              : '<div style="font-size:13px;line-height:1.5;color:#fbbf24;max-width:320px;">' +
                'Jste offline. Po smazání půjde aplikace stáhnout až s připojením.</div>') +
            '<button id="recovery-btn" type="button" style="min-height:52px;padding:0 24px;' +
            'background-color:#00d2ff;color:#000000;font-size:15px;font-weight:700;border:none;' +
            'border-radius:6px;cursor:pointer;">Smazat vše a stáhnout znovu</button>';
          document.body.appendChild(overlay);

          document.getElementById('recovery-btn').addEventListener('click', function () {
            var btn = document.getElementById('recovery-btn');
            if (btn) {
              btn.disabled = true;
              btn.textContent = 'Mažu…';
              btn.style.opacity = '0.6';
            }
            wipeAllAndRestart(false);
          });
        }

        // Must stay identical to wipeAllAndRestart() in public/sw.js - neither
        // place can share code, as both run when the app itself may not load.
        // The running app reuses it via window.__samuelWipeAll ("Reset všech
        // dat"), so the app has exactly one wipe routine.
        //
        // Wipes ALL offline data (app caches, dictionary DB, SW registration) and
        // restarts onboarding from the network. "full" also clears localStorage and
        // sessionStorage (user settings); otherwise only the dictionary metadata.
        // Can never hang: it navigates once every step settles or after a hard
        // deadline, whichever comes first. Any DB worker must already be dead
        // (terminated, or gone with the previous page); files it held stay locked
        // for a moment, so OPFS removal is retried, and whatever still survives is
        // orphaned by the missing pointer and unlinked by the next DB worker.
        function wipeAllAndRestart(full) {
          var navigated = false;
          function restart() {
            if (navigated) return;
            navigated = true;
            location.href = '/?sw-strategy=network';
          }
          setTimeout(restart, 4000);

          try {
            if (full) {
              localStorage.clear();
              sessionStorage.clear();
            } else {
              localStorage.removeItem('samuel_words_db_meta');
            }
          } catch (e) {}
          try { indexedDB.deleteDatabase('samuel_offline_storage'); } catch (e) {}

          function settle(run) {
            try {
              return Promise.resolve(run()).catch(function (e) { console.warn('Wipe step failed', e); });
            } catch (e) {
              console.warn('Wipe step failed', e);
              return Promise.resolve();
            }
          }
          function wipeOpfs(attemptsLeft) {
            return navigator.storage.getDirectory().then(function (root) {
              // Pointer first: without it no dictionary counts as installed.
              return root.removeEntry('samuel-db-active.txt').catch(function () {}).then(function () {
                var names = [];
                if (!root.keys) return names;
                var it = root.keys();
                function step() {
                  return it.next().then(function (r) {
                    if (r.done) return names;
                    names.push(r.value);
                    return step();
                  });
                }
                return step();
              }).then(function (names) {
                return Promise.all(names.map(function (n) {
                  return root.removeEntry(n, { recursive: true }).then(
                    function () { return true; },
                    function () { return false; }
                  );
                }));
              }).then(function (removed) {
                if (removed.indexOf(false) === -1 || attemptsLeft <= 1) return;
                return new Promise(function (r) { setTimeout(r, 400); }).then(function () {
                  return wipeOpfs(attemptsLeft - 1);
                });
              });
            });
          }

          Promise.all([
            settle(function () {
              if (!('caches' in window)) return;
              return caches.keys().then(function (names) {
                return Promise.all(names.map(function (n) { return caches.delete(n); }));
              });
            }),
            settle(function () {
              if (!navigator.storage || !navigator.storage.getDirectory) return;
              return wipeOpfs(5);
            }),
            settle(function () {
              // Unregister so the next load is uncontrolled like a brand new
              // visitor; otherwise the cache-only worker would 504 its scripts.
              if (!('serviceWorker' in navigator)) return;
              return navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              });
            })
          ]).then(restart, restart);
        }
        window.__samuelWipeAll = wipeAllAndRestart;

        // Catch the bootstrap module script (or any script) failing to load -
        // this fires even if bootstrap.ts itself never got to execute a single
        // line. Resource load errors don't bubble, so this must be capturing.
        window.addEventListener(
          'error',
          function (event) {
            var target = event && event.target;
            if (target && target.tagName === 'SCRIPT') {
              showRecovery('script-load-error');
            }
          },
          true
        );

        // Backstop: only fires if nothing has disarmed us by then (normal boot,
        // even on a slow low-end phone, or the legitimate first-run screen).
        timeoutId = setTimeout(function () {
          if (armed) showRecovery('timeout');
        }, RECOVERY_TIMEOUT_MS);
      })();
    </script>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
